<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color Picker with Page Wipe</title>
  
  
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      overflow: hidden;
      font-family: sans-serif;
      background-color: #0b1012;
    }

    #color-picker {
      list-style: none;
      padding: 0;
      margin: 0;
      position: fixed;
      --inset: 60px;
      top: var(--inset);
      left: var(--inset);
      right: var(--inset);
      bottom: var(--inset);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      --current-color: #0d63f8; /* Default blue color */
      background-image: radial-gradient(
        circle,
        var(--current-color) 10%,
        transparent 10%
      );
      background-size: 20px 20px;
      view-transition-name: color-picker-bg;
    }

    #color-picker button {
      position: relative;
      width: 80px;
      height: 80px;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      overflow: visible;
      outline: 10px solid black;
      transition: transform 0.2s ease;
    }

    #color-picker button:hover {
      transform: scale(1.05);
    }

    #color-picker .yellow button {
      background-color: #fff312;
    }

    #color-picker .blue button {
      background-color: #0d63f8;
    }

    #color-picker .pink button {
      background-color: #ff0088;
    }

    #color-picker .selected button::after {
      content: "";
      position: absolute;
      top: -8px;
      left: -8px;
      right: -8px;
      bottom: -8px;
      border: 4px solid #ffffff;
      border-radius: 50%;
      view-transition-name: color-picker-button;
    }

    /* View Transition API styles */
    @keyframes fade-in {
      from { opacity: 0; }
    }

    @keyframes fade-out {
      to { opacity: 0; }
    }

    @keyframes slide-from-right {
      from { transform: translateX(0px); }
    }

    @keyframes slide-to-left {
      to { transform: translateX(-30px); }
    }
 /**/
    ::view-transition-old(color-picker-bg) {
      /*animation: 300ms cubic-bezier(0.4, 0, 0.2, 1) both fade-out;*/
      animation: 300ms cubic-bezier(0.4, 0, 0.2, 1) ;
    }

    ::view-transition-new(color-picker-bg) {
      animation: 300ms cubic-bezier(0.4, 0, 0.2, 1) both fade-in;
      /*animation: 300ms cubic-bezier(0.4, 0, 0.2, 1);*/
    }

    ::view-transition-old(color-picker-button) {
      animation: 300ms cubic-bezier(0.4, 0, 0.2, 1) both slide-to-left;
      opacity: 0;
    }

    ::view-transition-new(color-picker-button) {
      animation: 300ms cubic-bezier(0.4, 0, 0.2, 1) both slide-from-right;
         
    }
  </style>

</head>


<body>


  <ul id="color-picker">
    <li class="yellow">
      <button data-color="#fff312" aria-label="Yellow"></button>
    </li>
    <li class="blue selected">
      <button data-color="#0d63f8" aria-label="Blue"></button>
    </li>
    <li class="pink">
      <button data-color="#ff0088" aria-label="Pink"></button>
    </li>
  </ul>

  <script type="module">
    // Check if View Transitions are supported
    if (!document.startViewTransition) {
      document.startViewTransition = (callback) => {
        callback();
        return {
          ready: Promise.resolve(),
          updateCallbackDone: Promise.resolve(),
          finished: Promise.resolve()
        };
      };
    }

    async function selectColor(element, { currentTarget, pageX, pageY }) {
      // Start the view transition
      const transition = document.startViewTransition(() => {
        // Update the DOM inside the transition callback
        const color = currentTarget.getAttribute("data-color");
        document.querySelector("#color-picker")
                .style.setProperty("--current-color", color);

        const selected = document.querySelector("#color-picker .selected");
        selected.classList.remove("selected");

        currentTarget.parentElement.classList.add("selected");
      });

      try {
        // Wait for the pseudo-elements to be created
        await transition.ready;

        // Animate the clip-path from the click position
        document.documentElement.animate(
          {
            clipPath: [
              `circle(0% at ${pageX}px ${pageY}px)`,
              `circle(100% at ${pageX}px ${pageY}px)`
            ]
          },
          {
            duration: 600,
            easing: "ease-in",
            pseudoElement: "::view-transition-new(color-picker-bg)"
          }
        );
      } catch (err) {
        console.error("View Transition failed:", err);
      }
    }

    // Set up event listeners
    document.querySelectorAll("#color-picker button").forEach(button => {
      button.addEventListener("click", (event) => {
        selectColor(button, event);
      });
    });
  </script>
</body>
</html>
